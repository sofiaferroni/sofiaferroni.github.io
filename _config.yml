title: "Home"
description: "Official Portfolio of Sofia Ferroni"

# Theme & Skin Configuration
minimal_mistakes_skin: "default"
remote_theme: "mmistakes/minimal-mistakes"

# Site Settings
markdown: kramdown
include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# BIOGRAPHY & CONTACTS (Left sidebar)
# Qui è dove gestisci tutti i tuoi profili social e contatti
author:
  name   : "Sofia Ferroni"
  bio    : "Second-year Master’s student in Linguistics at the University of Padua and Fellow of the Scuola Galileiana."
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:sofia.ferroni@studenti.unipd.it"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/ironssofi/"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook-square"
      url: "https://www.facebook.com/ferroni.sofia/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  - scope:
      path: "_pages"
    values:
      layout: single
      author_profile: true

      type: pages
    values:
      layout: single
      author_profile: true
