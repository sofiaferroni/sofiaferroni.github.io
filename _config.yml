title: "Sofia Ferroni"
description: "Official Portfolio of Sofia Ferroni"

# Theme & Skin Configuration
minimal_mistakes_skin: "default"
remote_theme: "mmistakes/minimal-mistakes"

# Site Settings
markdown: kramdown
include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# BIOGRAPHY (Left sidebar)
author:
  name   : "Sofia Ferroni"
  bio    : "Second-year Master’s student in Linguistics at the University of Padua and Fellow of the Scuola Galileiana."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
