title: "Il Portfolio di Sofia Ferroni"
description: "Sito ufficiale di Sofia Ferroni - CV, Poesie e Fotografia"

# Tema e Skin (Colori)
minimal_mistakes_skin: "default" # Puoi cambiarlo in "dark", "aqua" o "mint" più avanti
remote_theme: mmistakes/minimal-mistakes

# Configurazione del sito
markdown: kramdown
include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jinclude

# IL TUO PROFILO (Quello che apparirà nella colonna a sinistra)
author:
  name   : "Sofia Ferroni"
  bio    : "Benvenuti nel mio spazio digitale. Qui raccolgo il mio CV, le mie poesie e i miei scatti fotografici."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com" # Inserisci il tuo vero username qui

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
